<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchResults</title>
</head>
<body>

    <Header>
        <img src="/LabTask2/img/images.png" alt="Logo" width="80" height="80">
        <button type="submit">Dilver To</button>
        <select>
            <option value="T-Shirt">T-Shirt</option>
            <option value="Jeans">Jeans</option>
            <option value="Shoes">Shoes</option>
        </select>
        <input type="text" placeholder="Search...">
        <button type="submit">Search</button>
        <select>
            <option value="English">English</option>
            <option value="French">French</option>
            <option value="Spanish">Spanish</option>
        </select>
        <button type="submit">Login</button>
        <button type="submit">Order History</button>
        <button type="submit">Cart</button>
    </Header>

     <aside>
        <h3>Filters</h3>
        <ul>
            <li>Price
                <input type="range" value="0">
            </li>
            <li>Category
                <select>
                    <option value="T-Shirt">T-Shirt</option>
                    <option value="Jeans">Jeans</option>
                    <option value="Shoes">Shoes</option>
                </select>
            </li>
            <li>Size
                <select>
                    <option value="Small">S</option>
                    <option value="Medium">M</option>
                    <option value="Large">L</option>
                </select>
            </li>
        </ul>
    </aside>

    <h3>Search Results</h3>
    <section>
        <article>
            <h4>T-Shirt</h4>
            <img src="/LabTask2/img/KD7599_21_model.avif" alt="Product 1" width="200" height="200">
            <p>Description of Product 1</p>
            <p>Price: $50</p>
            <button type="submit">Add to Cart</button>
            <button><a href="/LabTask2/ProductDetails.html">View Details</a></button>
        </article>

        <article>
            <h4>Jeans</h4>
            <img src="/LabTask2/img/KG6450_21_model.avif" alt="Product 2" width="200" height="200">
            <p>Description of Product 2</p>
            <p>Price: $75</p>
            <button type="submit">Add to Cart</button>
        </article>

        <article>
            <h4>Shoes</h4>
            <img src="/LabTask2/img/KZ9157_01_00_standard.avif" alt="Product 3" width="200" height="200">
            <p>Description of Product 3</p>
            <p>Price: $100</p>
            <button type="submit">Add to Cart</button>
        </article>
    </section>
</body>
</html>
